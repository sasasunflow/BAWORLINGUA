<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Masuk ke BaworLingua</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo/logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS LOGIN -->
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background-image"></div>

    <div class="background-overlay"></div>

    <!-- =====================================
         LOGIN CONTAINER
    ====================================== -->

    <main class="login-container">
      <!-- =================================
             LOGIN CARD
        ================================== -->

      <div class="login-card">
        <!-- ==============================
                 BRAND
            =============================== -->

        <div class="brand">
          <img
            src="assets/logo/logo.png"
            alt="Logo BaworLingua"
            class="brand-logo"
          />

          <h2>Bawor<span>Lingua</span></h2>
        </div>

        <!-- ==============================
                 TITLE
            =============================== -->

        <h1 id="login-title">Masuk ke BaworLingua</h1>

        <!-- ==============================
                 LOGIN FORM
            =============================== -->

        <form id="loginForm">
          <!-- EMAIL -->

          <div class="form-group">
            <label for="email" id="email-label"> Email </label>

            <div class="input-box">
              <!-- Email Icon -->

              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>

                <polyline points="3,7 12,13 21,7"></polyline>
              </svg>

              <input
                type="email"
                id="email"
                placeholder="Masukkan email kamu"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <!-- PASSWORD -->

          <div class="form-group">
            <div class="password-label-row">
              <label for="password" id="password-label"> Password </label>

              <a href="#" id="forgot-password"> Lupa password? </a>
            </div>

            <div class="input-box">
              <!-- Lock Icon -->

              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="5" y="10" width="14" height="10" rx="2"></rect>

                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

                <circle cx="12" cy="15" r="1"></circle>
              </svg>

              <input
                type="password"
                id="password"
                placeholder="Masukkan password kamu"
                autocomplete="current-password"
                required
              />

              <!-- Password Toggle -->

              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Tampilkan password"
              >
                <svg
                  id="eyeIcon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                  ></path>

                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- ==============================
                     REMEMBER ME
                =============================== -->

          <div class="remember-container">
            <input type="checkbox" id="remember" />

            <label for="remember" id="remember-label"> Ingat saya </label>
          </div>

          <!-- ==============================
                     LOGIN BUTTON
                =============================== -->

          <button type="submit" class="login-button" id="login-button">
            Masuk
          </button>
        </form>

        <!-- ==============================
                 DIVIDER
            =============================== -->

        <div class="divider">
          <span></span>

          <p id="divider-text">atau masuk dengan</p>

          <span></span>
        </div>

        <!-- ==============================
                 SOCIAL LOGIN
            =============================== -->

        <div class="social-login">
          <!-- GOOGLE -->

          <button type="button" class="social-button">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M21.35 12.27c0-.68-.06-1.34-.17-1.97H12v3.73h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.14z"
              />

              <path
                fill="#34A853"
                d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.28v2.52A9.74 9.74 0 0 0 12 21.5z"
              />

              <path
                fill="#FBBC05"
                d="M6.53 13.6A5.85 5.85 0 0 1 6.23 12c0-.56.1-1.1.3-1.6V7.88H3.28A9.5 9.5 0 0 0 2.25 12c0 1.53.37 2.98 1.03 4.12l3.25-2.52z"
              />

              <path
                fill="#EA4335"
                d="M12 6.37c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.39 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.72 5.38l3.25 2.52C7.3 8.09 9.46 6.37 12 6.37z"
              />
            </svg>

            <span id="google-text"> Masuk dengan Google </span>
          </button>

          <!-- EMAIL -->

          <button type="button" class="social-button">
            <svg
              class="email-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>

              <polyline points="3,7 12,13 21,7"></polyline>
            </svg>

            <span id="email-login-text"> Masuk dengan Email </span>
          </button>
        </div>

        <!-- ==============================
                 REGISTER
            =============================== -->

        <div class="register">
          <span id="register-question"> Belum punya akun? </span>

          <a href="#" id="register-link">
            Daftar sekarang

            <span>›</span>
          </a>
        </div>
      </div>
    </main>

    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="js/login.js"></script>
  </body>
</html>
